<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel Gabriel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F6F5F2;
    --surface: #FFFFFF;
    --surface2: #F0EEE9;
    --border: #E4E1D8;
    --border2: #D4D0C4;
    --text: #1A1916;
    --text2: #5C5A54;
    --text3: #9B9890;
    --accent: #1C3A5E;
    --accent2: #2A5298;
    --accent-light: #EBF0F8;
    --red: #C0392B;
    --red-light: #FDECEA;
    --amber: #B7630A;
    --amber-light: #FEF4E6;
    --green: #1A6B3C;
    --green-light: #E8F5EE;
    --blue: #1A4A8A;
    --blue-light: #E8EFF8;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; }
  select, input, textarea, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideDown { from { opacity:0; transform:translateY(-8px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
  .card-enter { animation: fadeIn .22s ease both; }
  .modal-enter { animation: slideDown .2s ease both; }

  .btn { border:none; border-radius:var(--radius-sm); cursor:pointer; font-size:13px; font-weight:600; padding:9px 18px; transition:opacity .15s, transform .1s; }
  .btn:hover { opacity:.88; }
  .btn:active { transform:scale(.97); }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-ghost { background:var(--surface2); color:var(--text2); }
  .btn-danger { background:var(--red-light); color:var(--red); }

  .inp { width:100%; padding:9px 12px; border-radius:var(--radius-sm); border:1.5px solid var(--border); font-size:13.5px; outline:none; background:var(--surface); color:var(--text); transition:border-color .15s, box-shadow .15s; }
  .inp:focus { border-color:var(--accent2); box-shadow:0 0 0 3px rgba(42,82,152,.10); }

  .badge { display:inline-flex; align-items:center; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap; font-family:'DM Mono',monospace; letter-spacing:.02em; }

  .tab-btn { padding:9px 18px; border:none; background:none; cursor:pointer; font-size:13px; font-weight:500; color:var(--text3); border-bottom:2px solid transparent; margin-bottom:-2px; transition:color .15s, border-color .15s; white-space:nowrap; }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
  .tab-btn:hover:not(.active) { color:var(--text2); }

  .sol-card { background:var(--surface); border-radius:var(--radius); padding:16px 20px; border:1.5px solid var(--border); transition:border-color .15s, box-shadow .15s; }
  .sol-card:hover { box-shadow:var(--shadow); }
  .sol-card.critico { border-color:#F9CACA; background:#FFFAFA; }
  .sol-card.concluido { opacity:.55; }

  .seman-card { background:var(--surface); border-radius:var(--radius-sm); padding:12px 16px; border:1.5px solid var(--border); display:flex; align-items:center; gap:12px; transition:border-color .15s; cursor:pointer; }
  .seman-card:hover { border-color:var(--border2); box-shadow:var(--shadow); }
  .seman-card.vencida { border-color:#F9CACA; background:#FFFAFA; }

  .checkbox { width:20px; height:20px; border-radius:6px; border:2px solid var(--border2); background:transparent; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; transition:background .15s, border-color .15s; }
  .checkbox.checked { background:var(--green); border-color:var(--green); }

  .stat-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:16px 20px; flex:1 1 140px; }

  .overlay { position:fixed; inset:0; background:rgba(20,18,14,.45); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(2px); }
  .modal { background:var(--surface); border-radius:16px; width:100%; max-width:520px; padding:28px; box-shadow:var(--shadow-lg); max-height:90vh; overflow-y:auto; }
  .modal-wide { max-width:640px; }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:11.5px; font-weight:600; color:var(--text2); margin-bottom:4px; text-transform:uppercase; letter-spacing:.05em; }

  .prazo-tag { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .prazo-tag .label { font-size:10px; color:var(--text3); font-weight:500; text-transform:uppercase; letter-spacing:.06em; }
  .prazo-tag .value { font-size:12px; font-weight:700; padding:4px 12px; border-radius:8px; font-family:'DM Mono',monospace; }
  .prazo-tag .date { font-size:10px; color:var(--text3); font-family:'DM Mono',monospace; }

  .status-select { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; border:none; cursor:pointer; outline:none; font-family:'DM Mono',monospace; }

  .dia-header { font-size:10.5px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px; }

  .alerta { border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:16px; font-size:12.5px; display:flex; align-items:center; gap:8px; }
  .alerta-critico { background:#FFF5F5; border:1.5px solid #F9CACA; color:var(--red); }

  .empty-state { text-align:center; color:var(--text3); padding:72px 0; font-size:14px; }
  .empty-state .icon { font-size:36px; margin-bottom:12px; opacity:.5; }

  .login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); padding:24px; }
  .login-box { background:var(--surface); border-radius:16px; padding:36px; max-width:440px; width:100%; box-shadow:var(--shadow-lg); border:1.5px solid var(--border); }

  .comentario-item { background:var(--surface2); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:8px; }
  .comentario-item .meta { font-size:11px; color:var(--text3); margin-bottom:4px; font-family:'DM Mono',monospace; }
  .comentario-item .texto { font-size:13.5px; color:var(--text); line-height:1.5; }

  .cat-tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; margin:3px; }
  .cat-remove { background:none; border:none; cursor:pointer; font-size:13px; line-height:1; padding:0; opacity:.6; }
  .cat-remove:hover { opacity:1; }

  .seman-dia-badge { font-size:11px; font-weight:600; padding:2px 8px; border-radius:12px; background:var(--surface2); color:var(--text2); font-family:'DM Mono',monospace; }
  .seman-vencida-badge { background:var(--red-light); color:var(--red); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Constantes ────────────────────────────────────────────────────
const today = new Date(); today.setHours(0,0,0,0);
const fmt = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString("pt-BR") : "–";
const fmtDT = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const DIAS = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const STATUS_SOL = ["Em andamento","Aguardando revisão","Concluído"];
const CATS_DEFAULT = ["Contratos","Cobranças","Distratos","Documentos","Notificações","Outro"];

// Boards Monday
const BOARD_SOL   = "Solicitações Jurídicas – Pessoal";
const BOARD_SEMAN = "Atividades Semanais – Pessoal";
const BOARD_META  = "Config – Painel Gabriel";

const catColorPalette = [
  { bg:"#EDE9FE", color:"#5B21B6" },
  { bg:"#FEE2E2", color:"#B91C1C" },
  { bg:"#FFEDD5", color:"#C2410C" },
  { bg:"#F1F5F9", color:"#475569" },
  { bg:"#DBEAFE", color:"#1D4ED8" },
  { bg:"#F0FDF4", color:"#166534" },
  { bg:"#FEF9C3", color:"#854D0E" },
  { bg:"#FCE7F3", color:"#9D174D" },
];
function catColor(cats, cat) {
  const idx = cats.indexOf(cat);
  return catColorPalette[idx % catColorPalette.length] || { bg:"#F1F5F9", color:"#64748B" };
}

const statusColor = {
  "Em andamento":      { bg:"#DBEAFE", color:"#1D4ED8" },
  "Aguardando revisão":{ bg:"#FEF3C7", color:"#B45309" },
  "Concluído":         { bg:"#D1FAE5", color:"#065F46" },
};
const mondayStatusReverse = {
  "working_on_it":"Em andamento",
  "stuck":"Aguardando revisão",
  "done":"Concluído",
};

function prazoStatus(dateStr) {
  if (!dateStr) return { label:"–", color:"#9B9890", bg:"#F1F0EC" };
  const d = new Date(dateStr + 'T12:00:00');
  const diff = Math.ceil((d - today) / (1000*60*60*24));
  if (diff < 0)   return { label:"Vencido",  color:"#C0392B", bg:"#FDECEA" };
  if (diff === 0) return { label:"Hoje",     color:"#C0392B", bg:"#FDECEA" };
  if (diff === 1) return { label:"Amanhã",   color:"#B7630A", bg:"#FEF4E6" };
  if (diff <= 3)  return { label:`${diff}d`, color:"#B7630A", bg:"#FEF4E6" };
  if (diff <= 7)  return { label:`${diff}d`, color:"#1A4A8A", bg:"#E8EFF8" };
  return { label:`${diff}d`, color:"#5C5A54", bg:"#F0EEE9" };
}
function isCritico(s) {
  if (s.status === "Concluído" || !s.prazoInterno) return false;
  const d = new Date(s.prazoInterno + 'T12:00:00');
  return Math.ceil((d - today) / (1000*60*60*24)) <= 1;
}

// Vencida = dia da semana já passou nesta semana e não foi feita
function isVencida(t) {
  if (t.feito) return false;
  // Se tem prazoData explícito, usa ele
  if (t.prazoData) {
    const d = new Date(t.prazoData + 'T12:00:00');
    return d < today;
  }
  // Caso contrário, compara dia da semana
  const diaIdx = DIAS.indexOf(t.dia);
  const todayIdx = today.getDay() === 0 ? 6 : today.getDay() - 1; // 0=Seg
  return diaIdx < todayIdx;
}

// ── API Monday ────────────────────────────────────────────────────
async function mondayQuery(apiKey, query, variables = {}) {
  const res = await fetch("/api/monday", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ query, variables, apiKey }),
  });
  const data = await res.json();
  if (data.errors) throw new Error(data.errors[0].message);
  return data.data;
}

async function getOrCreateBoardByName(apiKey, name, cols, isPrivate = true) {
  const data = await mondayQuery(apiKey, `{ boards(limit:100) { id name } }`);
  const existing = data.boards.find(b => b.name === name);
  if (existing) return existing.id;
  const kind = isPrivate ? "private" : "public";
  const created = await mondayQuery(apiKey,
    `mutation { create_board(board_name: "${name}", board_kind: ${kind}) { id } }`
  );
  const boardId = created.create_board.id;
  for (const col of cols) {
    await mondayQuery(apiKey,
      `mutation { create_column(board_id: ${boardId}, title: "${col.title}", column_type: ${col.type}) { id } }`
    );
  }
  return boardId;
}

async function getBoardCols(apiKey, boardId) {
  const data = await mondayQuery(apiKey, `query { boards(ids:[${boardId}]) { columns { id title } } }`);
  return data.boards[0]?.columns || [];
}

function findCol(cols, kw) {
  return cols.find(c => c.title.toLowerCase().includes(kw.toLowerCase()))?.id;
}

function fromMondayDate(val) {
  if (!val) return "";
  try { const d = JSON.parse(val); return d.date || ""; } catch { return val || ""; }
}

// ── Board Solicitações ────────────────────────────────────────────
async function initBoardSol(apiKey) {
  return getOrCreateBoardByName(apiKey, BOARD_SOL, [
    {title:"Categoria",     type:"text"},
    {title:"Prazo Interno", type:"date"},
    {title:"Prazo Externo", type:"date"},
    {title:"Observações",   type:"text"},
  ]);
}

async function fetchSolicitacoes(apiKey, boardId) {
  const data = await mondayQuery(apiKey, `
    query {
      boards(ids:[${boardId}]) {
        columns { id title }
        items_page(limit:200) {
          items { id name column_values { id text value } }
        }
      }
    }
  `);
  const board = data.boards[0];
  const cols  = board?.columns || [];
  const items = board?.items_page?.items || [];
  const piId  = findCol(cols,"prazo interno");
  const peId  = findCol(cols,"prazo externo");
  const catId = findCol(cols,"categoria");
  const obsId = findCol(cols,"observa");
  return items.map(item => {
    const cv = (id) => id ? item.column_values.find(c => c.id === id) : null;
    const statusCol = item.column_values.find(c => c.id === "status");
    return {
      id: item.id, mondayId: item.id, titulo: item.name,
      categoria:    cv(catId)?.text || "Outro",
      status:       mondayStatusReverse[statusCol?.text?.toLowerCase()?.replace(/ /g,"_")] || "Em andamento",
      prazoInterno: fromMondayDate(cv(piId)?.value) || "",
      prazoExterno: fromMondayDate(cv(peId)?.value) || "",
      obs:          cv(obsId)?.text || "",
      _colIds:      { piId, peId, catId, obsId },
    };
  });
}

async function createSol(apiKey, boardId, item, colIds) {
  const vals = {};
  if (colIds.catId) vals[colIds.catId] = item.categoria;
  if (colIds.piId && item.prazoInterno) vals[colIds.piId] = { date: item.prazoInterno };
  if (colIds.peId && item.prazoExterno) vals[colIds.peId] = { date: item.prazoExterno };
  if (colIds.obsId) vals[colIds.obsId] = item.obs || "";
  vals["status"] = { label: item.status };
  const r = await mondayQuery(apiKey,
    `mutation($name:String!,$vals:JSON!){ create_item(board_id:${boardId},item_name:$name,column_values:$vals){id} }`,
    { name: item.titulo, vals: JSON.stringify(vals) }
  );
  return r.create_item.id;
}

async function updateSol(apiKey, boardId, mondayId, item, colIds) {
  const vals = {};
  if (colIds.catId) vals[colIds.catId] = item.categoria;
  if (colIds.piId && item.prazoInterno) vals[colIds.piId] = { date: item.prazoInterno };
  if (colIds.peId && item.prazoExterno) vals[colIds.peId] = { date: item.prazoExterno };
  if (colIds.obsId) vals[colIds.obsId] = item.obs || "";
  vals["status"] = { label: item.status };
  await mondayQuery(apiKey,
    `mutation($id:ID!,$name:String!,$vals:JSON!){
      change_multiple_column_values(item_id:$id,board_id:${boardId},column_values:$vals){id}
      change_item_name(item_id:$id,board_id:${boardId},value:$name){id}
    }`,
    { id: mondayId, name: item.titulo, vals: JSON.stringify(vals) }
  );
}

async function deleteMondayItem(apiKey, mondayId) {
  await mondayQuery(apiKey, `mutation { delete_item(item_id: ${mondayId}) { id } }`);
}

// ── Board Atividades Semanais ─────────────────────────────────────
// Estrutura: cada atividade = 1 item no Monday
// Campos: Dia (text), Feito (status), PrazoData (date), Comentários (long_text)
// Comentários são serializados como JSON no campo long_text

async function initBoardSeman(apiKey) {
  return getOrCreateBoardByName(apiKey, BOARD_SEMAN, [
    {title:"Dia",        type:"text"},
    {title:"PrazoData",  type:"date"},
    {title:"Comentários",type:"long_text"},
  ]);
}

async function fetchSemanais(apiKey, boardId) {
  const data = await mondayQuery(apiKey, `
    query {
      boards(ids:[${boardId}]) {
        columns { id title }
        items_page(limit:200) {
          items { id name column_values { id text value } }
        }
      }
    }
  `);
  const board = data.boards[0];
  const cols  = board?.columns || [];
  const items = board?.items_page?.items || [];
  const diaId    = findCol(cols,"dia");
  const prazoId  = findCol(cols,"prazodata");
  const comentId = findCol(cols,"coment");
  return items.map(item => {
    const cv = (id) => id ? item.column_values.find(c => c.id === id) : null;
    const statusCol = item.column_values.find(c => c.id === "status");
    let comentarios = [];
    try { const raw = cv(comentId)?.text; if (raw) comentarios = JSON.parse(raw); } catch {}
    return {
      id:          item.id,
      mondayId:    item.id,
      titulo:      item.name,
      dia:         cv(diaId)?.text || "Segunda",
      feito:       statusCol?.text?.toLowerCase() === "done",
      prazoData:   fromMondayDate(cv(prazoId)?.value) || "",
      comentarios,
      _colIds:     { diaId, prazoId, comentId },
    };
  });
}

async function createSeman(apiKey, boardId, item, colIds) {
  const vals = {};
  if (colIds.diaId)   vals[colIds.diaId]   = item.dia;
  if (colIds.prazoId && item.prazoData) vals[colIds.prazoId] = { date: item.prazoData };
  if (colIds.comentId) vals[colIds.comentId] = JSON.stringify(item.comentarios || []);
  vals["status"] = { label: item.feito ? "done" : "not_started" };
  const r = await mondayQuery(apiKey,
    `mutation($name:String!,$vals:JSON!){ create_item(board_id:${boardId},item_name:$name,column_values:$vals){id} }`,
    { name: item.titulo, vals: JSON.stringify(vals) }
  );
  return r.create_item.id;
}

async function updateSeman(apiKey, boardId, mondayId, item, colIds) {
  const vals = {};
  if (colIds.diaId)   vals[colIds.diaId]   = item.dia;
  if (colIds.prazoId) vals[colIds.prazoId]  = item.prazoData ? { date: item.prazoData } : null;
  if (colIds.comentId) vals[colIds.comentId] = JSON.stringify(item.comentarios || []);
  vals["status"] = { label: item.feito ? "done" : "not_started" };
  await mondayQuery(apiKey,
    `mutation($id:ID!,$name:String!,$vals:JSON!){
      change_multiple_column_values(item_id:$id,board_id:${boardId},column_values:$vals){id}
      change_item_name(item_id:$id,board_id:${boardId},value:$name){id}
    }`,
    { id: mondayId, name: item.titulo, vals: JSON.stringify(vals) }
  );
}

// ── Board Meta (categorias) ───────────────────────────────────────
async function initBoardMeta(apiKey) {
  return getOrCreateBoardByName(apiKey, BOARD_META, [
    {title:"Valor", type:"text"},
  ]);
}

async function fetchCats(apiKey, boardId) {
  const data = await mondayQuery(apiKey, `
    query {
      boards(ids:[${boardId}]) {
        columns { id title }
        items_page(limit:10) {
          items { id name column_values { id text } }
        }
      }
    }
  `);
  const board = data.boards[0];
  const items = board?.items_page?.items || [];
  const cols  = board?.columns || [];
  const valId = findCol(cols,"valor");
  // Procura item "categorias"
  const item = items.find(i => i.name.toLowerCase() === "categorias");
  if (!item) return { id: null, cats: CATS_DEFAULT, valId };
  const cv = item.column_values.find(c => c.id === valId);
  let cats = CATS_DEFAULT;
  try { if (cv?.text) cats = JSON.parse(cv.text); } catch {}
  return { id: item.id, cats, valId };
}

async function saveCats(apiKey, boardId, cats, itemId, valId) {
  const val = JSON.stringify(cats);
  if (itemId) {
    const vals = {}; vals[valId] = val;
    await mondayQuery(apiKey,
      `mutation($id:ID!,$vals:JSON!){ change_multiple_column_values(item_id:$id,board_id:${boardId},column_values:$vals){id} }`,
      { id: itemId, vals: JSON.stringify(vals) }
    );
    return itemId;
  } else {
    const vals = {}; if (valId) vals[valId] = val;
    const r = await mondayQuery(apiKey,
      `mutation($name:String!,$vals:JSON!){ create_item(board_id:${boardId},item_name:$name,column_values:$vals){id} }`,
      { name: "categorias", vals: JSON.stringify(vals) }
    );
    return r.create_item.id;
  }
}

// ── Componentes base ──────────────────────────────────────────────
function Modal({ title, onClose, children, wide }) {
  useEffect(() => {
    const esc = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, [onClose]);
  return (
    <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className={`modal modal-enter ${wide?"modal-wide":""}`}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"22px"}}>
          <span style={{fontWeight:700,fontSize:"15px"}}>{title}</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"22px",cursor:"pointer",color:"var(--text3)",lineHeight:1,padding:0}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Field({ label, children }) {
  return (
    <div className="field">
      <label>{label}</label>
      {children}
    </div>
  );
}
function PrazoTag({ label, dateStr }) {
  const ps = prazoStatus(dateStr);
  return (
    <div className="prazo-tag">
      <span className="label">{label}</span>
      <span className="value" style={{background:ps.bg,color:ps.color}}>{ps.label}</span>
      {dateStr && <span className="date">{fmt(dateStr)}</span>}
    </div>
  );
}
function Checkbox({ checked, onClick }) {
  return (
    <div className={`checkbox ${checked?"checked":""}`} onClick={e=>{e.stopPropagation();onClick();}}>
      {checked && <span style={{color:"#fff",fontSize:"11px",fontWeight:700}}>✓</span>}
    </div>
  );
}

// ── Modal Atividade Detalhes ──────────────────────────────────────
function ModalAtividade({ atividade, onClose, onSave, saving }) {
  const [novoComent, setNovoComent] = useState("");
  const [novoDia,    setNovoDia]    = useState(atividade.dia);
  const [novoPrazo,  setNovoPrazo]  = useState(atividade.prazoData || "");
  const [comentarios, setComentarios] = useState(atividade.comentarios || []);
  const [salvando, setSalvando] = useState(false);

  const adicionarComentario = () => {
    if (!novoComent.trim()) return;
    const c = { id: genId(), texto: novoComent.trim(), data: new Date().toISOString() };
    setComentarios(prev => [...prev, c]);
    setNovoComent("");
  };

  const removerComentario = (id) => setComentarios(prev => prev.filter(c => c.id !== id));

  const handleSalvar = async () => {
    setSalvando(true);
    await onSave({ ...atividade, dia: novoDia, prazoData: novoPrazo, comentarios });
    setSalvando(false);
    onClose();
  };

  const vencida = isVencida({ ...atividade, dia: novoDia, prazoData: novoPrazo });

  return (
    <Modal title={atividade.titulo} onClose={onClose} wide>
      <div style={{display:"flex",gap:"12px",marginBottom:"20px",flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
          <span className={`seman-dia-badge ${vencida?"seman-vencida-badge":""}`}>{novoDia}</span>
          {vencida && <span style={{fontSize:"11px",color:"var(--red)",fontWeight:600}}>Vencida</span>}
        </div>
      </div>

      {/* Reagendar */}
      <div style={{background:"var(--surface2)",borderRadius:"var(--radius-sm)",padding:"14px 16px",marginBottom:"20px"}}>
        <div style={{fontSize:"11.5px",fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:"12px"}}>Reagendar</div>
        <div style={{display:"flex",gap:"12px",flexWrap:"wrap"}}>
          <Field label="Dia da semana">
            <select className="inp" value={novoDia} onChange={e=>setNovoDia(e.target.value)} style={{minWidth:"140px"}}>
              {DIAS.map(d=><option key={d}>{d}</option>)}
            </select>
          </Field>
          <Field label="Data específica (opcional)">
            <input type="date" className="inp" value={novoPrazo} onChange={e=>setNovoPrazo(e.target.value)} style={{minWidth:"160px"}} />
          </Field>
        </div>
      </div>

      {/* Comentários */}
      <div style={{marginBottom:"20px"}}>
        <div style={{fontSize:"11.5px",fontWeight:700,color:"var(--text2)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:"10px"}}>
          Comentários {comentarios.length > 0 && <span style={{color:"var(--text3)",fontWeight:400}}>({comentarios.length})</span>}
        </div>

        {comentarios.length === 0 && (
          <div style={{fontSize:"13px",color:"var(--text3)",padding:"12px 0"}}>Nenhum comentário ainda.</div>
        )}

        <div style={{maxHeight:"200px",overflowY:"auto",marginBottom:"12px"}}>
          {comentarios.map(c => (
            <div key={c.id} className="comentario-item">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div className="meta">{fmtDT(c.data)}</div>
                <button className="cat-remove" onClick={()=>removerComentario(c.id)} title="Remover comentário">✕</button>
              </div>
              <div className="texto">{c.texto}</div>
            </div>
          ))}
        </div>

        <div style={{display:"flex",gap:"8px"}}>
          <textarea
            className="inp"
            style={{resize:"none",height:"68px",flex:1}}
            placeholder="Adicionar comentário… (ex: Verifiquei o processo em 06/05/2026)"
            value={novoComent}
            onChange={e=>setNovoComent(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) adicionarComentario(); }}
          />
          <button className="btn btn-primary" style={{alignSelf:"flex-end",whiteSpace:"nowrap"}} onClick={adicionarComentario}>
            Adicionar
          </button>
        </div>
        <div style={{fontSize:"11px",color:"var(--text3)",marginTop:"5px"}}>Ctrl+Enter para adicionar rapidamente</div>
      </div>

      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",borderTop:"1px solid var(--border)",paddingTop:"16px"}}>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={handleSalvar} disabled={salvando}>
          {salvando ? "Salvando…" : "Salvar alterações"}
        </button>
      </div>
    </Modal>
  );
}

// ── Modal Categorias ──────────────────────────────────────────────
function ModalCategorias({ cats, onClose, onSave, saving }) {
  const [lista, setLista] = useState([...cats]);
  const [nova,  setNova]  = useState("");

  const adicionar = () => {
    const t = nova.trim();
    if (!t || lista.includes(t)) return;
    setLista(prev => [...prev, t]);
    setNova("");
  };
  const remover = (c) => setLista(prev => prev.filter(x => x !== c));

  return (
    <Modal title="Gerenciar categorias" onClose={onClose}>
      <div style={{marginBottom:"16px",display:"flex",flexWrap:"wrap",gap:"4px",minHeight:"40px"}}>
        {lista.map((c,i) => {
          const cc = catColorPalette[i % catColorPalette.length];
          return (
            <span key={c} className="cat-tag" style={{background:cc.bg,color:cc.color}}>
              {c}
              <button className="cat-remove" onClick={()=>remover(c)} style={{color:cc.color}}>✕</button>
            </span>
          );
        })}
        {lista.length === 0 && <span style={{fontSize:"13px",color:"var(--text3)"}}>Nenhuma categoria.</span>}
      </div>
      <div style={{display:"flex",gap:"8px",marginBottom:"20px"}}>
        <input className="inp" placeholder="Nome da nova categoria" value={nova} onChange={e=>setNova(e.target.value)} onKeyDown={e=>e.key==="Enter"&&adicionar()} />
        <button className="btn btn-primary" style={{whiteSpace:"nowrap"}} onClick={adicionar}>Adicionar</button>
      </div>
      <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",borderTop:"1px solid var(--border)",paddingTop:"16px"}}>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={()=>onSave(lista)} disabled={saving}>
          {saving ? "Salvando…" : "Salvar"}
        </button>
      </div>
    </Modal>
  );
}

// ── App ───────────────────────────────────────────────────────────
function App() {
  const [apiKey,     setApiKey]     = useState("");
  const [apiInput,   setApiInput]   = useState("");
  const [connecting, setConnecting] = useState(false);
  const [connError,  setConnError]  = useState("");

  // Board IDs
  const [boardSolId,   setBoardSolId]   = useState(null);
  const [boardSemanId, setBoardSemanId] = useState(null);
  const [boardMetaId,  setBoardMetaId]  = useState(null);

  // Col IDs
  const [colIdsSol,   setColIdsSol]   = useState({});
  const [colIdsSeman, setColIdsSeman] = useState({});

  // Dados
  const [solicitacoes, setSolicitacoes] = useState([]);
  const [semanais,     setSemanais]     = useState([]);
  const [cats,         setCats]         = useState(CATS_DEFAULT);
  const [catItemId,    setCatItemId]    = useState(null);
  const [catValId,     setCatValId]     = useState(null);

  const [loading, setLoading] = useState(false);
  const [saving,  setSaving]  = useState(false);

  const [aba,          setAba]          = useState("solicitacoes");
  const [filtroStatus, setFiltroStatus] = useState("Todos");
  const [filtroCat,    setFiltroCat]    = useState("Todas");
  const [busca,        setBusca]        = useState("");

  // Modais
  const [modalSol,      setModalSol]      = useState(false);
  const [modalSeman,    setModalSeman]    = useState(false);
  const [modalCats,     setModalCats]     = useState(false);
  const [modalAtiv,     setModalAtiv]     = useState(null); // atividade selecionada
  const [editSol,       setEditSol]       = useState(null);
  const [editSeman,     setEditSeman]     = useState(null);
  const [confirmDel,    setConfirmDel]    = useState(null);
  const [formErr,       setFormErr]       = useState("");

  const emptyFormSol  = { titulo:"", categoria: cats[0] || "Contratos", status:"Em andamento", prazoInterno:"", prazoExterno:"", obs:"" };
  const [formSol,   setFormSol]   = useState(emptyFormSol);
  const [formSeman, setFormSeman] = useState({ titulo:"", dia:"Segunda" });

  // ── Init ──
  useEffect(() => {
    const k = localStorage.getItem("pg_monday_key");
    if (k) { setApiKey(k); initAll(k); }
  }, []);

  const initAll = async (key) => {
    setLoading(true); setConnError("");
    try {
      // Boards em paralelo
      const [bSol, bSeman, bMeta] = await Promise.all([
        initBoardSol(key),
        initBoardSeman(key),
        initBoardMeta(key),
      ]);
      setBoardSolId(bSol); setBoardSemanId(bSeman); setBoardMetaId(bMeta);
      localStorage.setItem("pg_board_sol",   bSol);
      localStorage.setItem("pg_board_seman", bSeman);
      localStorage.setItem("pg_board_meta",  bMeta);

      // Dados em paralelo
      const [sols, semans, catData] = await Promise.all([
        fetchSolicitacoes(key, bSol),
        fetchSemanais(key, bSeman),
        fetchCats(key, bMeta),
      ]);
      setSolicitacoes(sols);
      setSemanais(semans);
      setCats(catData.cats);
      setCatItemId(catData.id);
      setCatValId(catData.valId);

      // Col IDs
      if (sols.length > 0) setColIdsSol(sols[0]._colIds);
      else {
        const cols = await getBoardCols(key, bSol);
        setColIdsSol({
          piId:  findCol(cols,"prazo interno"),
          peId:  findCol(cols,"prazo externo"),
          catId: findCol(cols,"categoria"),
          obsId: findCol(cols,"observa"),
        });
      }
      if (semans.length > 0) setColIdsSeman(semans[0]._colIds);
      else {
        const cols = await getBoardCols(key, bSeman);
        setColIdsSeman({
          diaId:    findCol(cols,"dia"),
          prazoId:  findCol(cols,"prazodata"),
          comentId: findCol(cols,"coment"),
        });
      }
    } catch(e) { setConnError("Erro ao conectar: " + e.message); }
    setLoading(false);
  };

  const reloadAll = async () => {
    if (!apiKey || !boardSolId) return;
    setLoading(true);
    try {
      const [sols, semans, catData] = await Promise.all([
        fetchSolicitacoes(apiKey, boardSolId),
        fetchSemanais(apiKey, boardSemanId),
        fetchCats(apiKey, boardMetaId),
      ]);
      setSolicitacoes(sols);
      setSemanais(semans);
      setCats(catData.cats);
      setCatItemId(catData.id);
      if (sols.length > 0)   setColIdsSol(sols[0]._colIds);
      if (semans.length > 0) setColIdsSeman(semans[0]._colIds);
    } catch(e) { console.error(e); }
    setLoading(false);
  };

  const connect = async () => {
    if (!apiInput.trim()) return;
    setConnecting(true); setConnError("");
    const key = apiInput.trim();
    localStorage.setItem("pg_monday_key", key);
    setApiKey(key);
    await initAll(key);
    setConnecting(false);
  };

  const disconnect = () => {
    ["pg_monday_key","pg_board_sol","pg_board_seman","pg_board_meta"].forEach(k => localStorage.removeItem(k));
    setApiKey(""); setBoardSolId(null); setSolicitacoes([]); setSemanais([]);
  };

  // ── Solicitações ──
  const openNewSol  = () => { setEditSol(null); setFormSol({...emptyFormSol, categoria: cats[0]||"Contratos"}); setFormErr(""); setModalSol(true); };
  const openEditSol = (s) => { setEditSol(s); setFormSol({titulo:s.titulo,categoria:s.categoria,status:s.status,prazoInterno:s.prazoInterno,prazoExterno:s.prazoExterno,obs:s.obs||""}); setFormErr(""); setModalSol(true); };

  const submitSol = async () => {
    if (!formSol.titulo.trim()) { setFormErr("O título é obrigatório."); return; }
    if (!formSol.prazoInterno)  { setFormErr("Informe o prazo interno."); return; }
    if (!formSol.prazoExterno)  { setFormErr("Informe o prazo externo."); return; }
    setFormErr(""); setSaving(true);
    try {
      if (editSol) {
        await updateSol(apiKey, boardSolId, editSol.mondayId, formSol, colIdsSol);
        setSolicitacoes(prev => prev.map(s => s.mondayId===editSol.mondayId ? {...s,...formSol} : s));
      } else {
        const newId = await createSol(apiKey, boardSolId, formSol, colIdsSol);
        setSolicitacoes(prev => [...prev, {...formSol, id:newId, mondayId:newId}]);
      }
      setModalSol(false);
    } catch(e) { setFormErr("Erro ao salvar: " + e.message); }
    setSaving(false);
  };

  const deleteSol = async (s) => {
    setSaving(true);
    try { await deleteMondayItem(apiKey, s.mondayId); setSolicitacoes(prev => prev.filter(x => x.mondayId!==s.mondayId)); }
    catch(e) { alert("Erro: " + e.message); }
    setSaving(false); setConfirmDel(null);
  };

  const changeStatusSol = async (s, status) => {
    setSolicitacoes(prev => prev.map(x => x.mondayId===s.mondayId ? {...x,status} : x));
    try { await updateSol(apiKey, boardSolId, s.mondayId, {...s,status}, colIdsSol); } catch {}
  };

  // ── Atividades Semanais ──
  const openNewSeman  = () => { setEditSeman(null); setFormSeman({titulo:"",dia:"Segunda"}); setModalSeman(true); };
  const openEditSeman = (t) => { setEditSeman(t); setFormSeman({titulo:t.titulo,dia:t.dia}); setModalSeman(true); };

  const submitSeman = async () => {
    if (!formSeman.titulo.trim()) return;
    setSaving(true);
    try {
      if (editSeman) {
        const updated = {...editSeman, titulo:formSeman.titulo, dia:formSeman.dia};
        await updateSeman(apiKey, boardSemanId, editSeman.mondayId, updated, colIdsSeman);
        setSemanais(prev => prev.map(t => t.mondayId===editSeman.mondayId ? updated : t));
      } else {
        const novo = {...formSeman, comentarios:[], feito:false, prazoData:""};
        const newId = await createSeman(apiKey, boardSemanId, novo, colIdsSeman);
        setSemanais(prev => [...prev, {...novo, id:newId, mondayId:newId}]);
      }
    } catch(e) { alert("Erro: " + e.message); }
    setSaving(false); setModalSeman(false);
  };

  const toggleSeman = async (t) => {
    const updated = {...t, feito: !t.feito};
    setSemanais(prev => prev.map(x => x.mondayId===t.mondayId ? updated : x));
    try { await updateSeman(apiKey, boardSemanId, t.mondayId, updated, colIdsSeman); } catch {}
  };

  const deleteSeman = async (mondayId) => {
    setSaving(true);
    try { await deleteMondayItem(apiKey, mondayId); setSemanais(prev => prev.filter(t => t.mondayId!==mondayId)); }
    catch(e) { alert("Erro: " + e.message); }
    setSaving(false); setConfirmDel(null);
  };

  const resetSemana = async () => {
    const updated = semanais.map(t => ({...t, feito:false}));
    setSemanais(updated);
    try {
      await Promise.all(updated.map(t => updateSeman(apiKey, boardSemanId, t.mondayId, t, colIdsSeman)));
    } catch {}
  };

  const saveAtividade = async (atividadeAtualizada) => {
    setSemanais(prev => prev.map(t => t.mondayId===atividadeAtualizada.mondayId ? atividadeAtualizada : t));
    await updateSeman(apiKey, boardSemanId, atividadeAtualizada.mondayId, atividadeAtualizada, colIdsSeman);
  };

  // ── Categorias ──
  const handleSaveCats = async (novaLista) => {
    setSaving(true);
    try {
      const newItemId = await saveCats(apiKey, boardMetaId, novaLista, catItemId, catValId);
      setCats(novaLista);
      if (!catItemId) setCatItemId(newItemId);
    } catch(e) { alert("Erro ao salvar categorias: " + e.message); }
    setSaving(false);
    setModalCats(false);
  };

  // ── Derivados ──
  const criticos   = solicitacoes.filter(isCritico);
  const vencidas   = semanais.filter(isVencida);
  const pendentes  = semanais.filter(t => !t.feito && !isVencida(t));

  const solFiltradas = solicitacoes.filter(s =>
    (filtroStatus==="Todos"  || s.status===filtroStatus) &&
    (filtroCat==="Todas"     || s.categoria===filtroCat) &&
    (!busca.trim() || s.titulo.toLowerCase().includes(busca.toLowerCase()) || (s.obs||"").toLowerCase().includes(busca.toLowerCase()))
  ).sort((a,b) => new Date(a.prazoInterno) - new Date(b.prazoInterno));

  // ── Login ──
  if (!apiKey) return (
    <div className="login-wrap">
      <div className="login-box">
        <img src="logo_Rottas_horizontal_sem_construtora.png" alt="Rottas" style={{height:"40px",marginBottom:"20px",objectFit:"contain"}} />
        <h1 style={{fontSize:"19px",fontWeight:700,marginBottom:"6px",color:"var(--text)"}}>Painel Gabriel</h1>
        <p style={{fontSize:"13px",color:"var(--text3)",marginBottom:"24px",lineHeight:1.6}}>Cole sua chave de API do Monday para acessar o painel.</p>
        <Field label="Chave de API do Monday">
          <input type="password" className="inp" value={apiInput} onChange={e=>setApiInput(e.target.value)} placeholder="Cole sua chave aqui" onKeyDown={e=>e.key==="Enter"&&connect()} />
        </Field>
        {connError && <div style={{background:"var(--red-light)",color:"var(--red)",fontSize:"12.5px",padding:"8px 12px",borderRadius:"8px",marginBottom:"12px"}}>{connError}</div>}
        <button className="btn btn-primary" style={{width:"100%"}} onClick={connect} disabled={connecting}>
          {connecting ? "Conectando…" : "Entrar"}
        </button>
        <p style={{fontSize:"11px",color:"var(--text3)",marginTop:"12px",textAlign:"center"}}>A chave fica salva no seu navegador.</p>
      </div>
    </div>
  );

  return (
    <div style={{maxWidth:"960px",margin:"0 auto",padding:"32px 20px",minHeight:"100vh"}}>

      {/* Cabeçalho */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"24px",flexWrap:"wrap",gap:"10px"}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"4px"}}>
            <img src="logo_Rottas_horizontal_sem_construtora.png" alt="Rottas" style={{height:"32px",objectFit:"contain"}} />
            <h1 style={{fontSize:"20px",fontWeight:700,color:"var(--text)"}}>Painel Gabriel</h1>
          </div>
          <p style={{fontSize:"12.5px",color:"var(--text3)"}}>
            {today.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
          </p>
        </div>
        <div style={{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:"11px",background:"var(--green-light)",color:"var(--green)",padding:"4px 10px",borderRadius:"20px",fontWeight:600,border:"1px solid #A7F3D0"}}>● Monday conectado</span>
          <button className="btn btn-ghost" style={{padding:"7px 12px",fontSize:"12px"}} onClick={reloadAll} disabled={loading}>{loading?"…":"↻ Atualizar"}</button>
          <button className="btn btn-danger" style={{padding:"7px 12px",fontSize:"12px"}} onClick={disconnect}>Desconectar</button>
        </div>
      </div>

      {/* Estatísticas */}
      <div style={{display:"flex",gap:"10px",marginBottom:"24px",flexWrap:"wrap"}}>
        {[
          { label:"Prazos internos críticos", value:criticos.length,  color:criticos.length>0?"var(--red)":"var(--green)",  bg:criticos.length>0?"var(--red-light)":"var(--green-light)",  border:criticos.length>0?"#F9CACA":"#A7F3D0" },
          { label:"Solicitações em aberto",   value:solicitacoes.filter(s=>s.status!=="Concluído").length, color:"var(--blue)",  bg:"var(--blue-light)",  border:"#BFDBFE" },
          { label:"Atividades pendentes",      value:pendentes.length, color:"var(--amber)", bg:"var(--amber-light)", border:"#FDE68A" },
          { label:"Atividades vencidas",       value:vencidas.length,  color:vencidas.length>0?"var(--red)":"var(--text3)", bg:vencidas.length>0?"var(--red-light)":"var(--surface2)", border:vencidas.length>0?"#F9CACA":"var(--border)" },
        ].map((c,i) => (
          <div key={i} className="stat-card" style={{borderColor:c.border,background:c.bg}}>
            <div style={{fontSize:"30px",fontWeight:700,color:c.color,fontFamily:"'DM Mono',monospace"}}>{c.value}</div>
            <div style={{fontSize:"11.5px",color:"var(--text2)",marginTop:"3px",fontWeight:500}}>{c.label}</div>
          </div>
        ))}
      </div>

      {/* Abas */}
      <div style={{display:"flex",gap:"2px",borderBottom:"2px solid var(--border)",marginBottom:"24px"}}>
        {[["solicitacoes","Solicitações"],["semanais","Atividades Semanais"]].map(([k,l]) => (
          <button key={k} className={`tab-btn ${aba===k?"active":""}`} onClick={() => setAba(k)}>{l}</button>
        ))}
      </div>

      {loading && <div style={{textAlign:"center",color:"var(--text3)",padding:"48px 0"}}>Carregando…</div>}

      {/* ── ABA SOLICITAÇÕES ── */}
      {!loading && aba==="solicitacoes" && (
        <div className="card-enter">
          {criticos.length > 0 && (
            <div className="alerta alerta-critico">
              <span>⚠️</span>
              <strong>{criticos.length} {criticos.length===1?"prazo crítico":"prazos críticos"}</strong>
              <span>– vence hoje ou amanhã</span>
            </div>
          )}

          <div style={{display:"flex",gap:"8px",marginBottom:"16px",flexWrap:"wrap",alignItems:"center"}}>
            <input className="inp" style={{flex:"1 1 200px"}} placeholder="Buscar…" value={busca} onChange={e=>setBusca(e.target.value)} />
            <select className="inp" value={filtroStatus} onChange={e=>setFiltroStatus(e.target.value)} style={{width:"auto",flex:"1 1 150px"}}>
              <option value="Todos">Todos os status</option>
              {STATUS_SOL.map(s=><option key={s}>{s}</option>)}
            </select>
            <select className="inp" value={filtroCat} onChange={e=>setFiltroCat(e.target.value)} style={{width:"auto",flex:"1 1 150px"}}>
              <option value="Todas">Todas as categorias</option>
              {cats.map(c=><option key={c}>{c}</option>)}
            </select>
            <button className="btn btn-ghost" style={{whiteSpace:"nowrap"}} onClick={()=>setModalCats(true)}>⚙ Categorias</button>
            <button className="btn btn-primary" onClick={openNewSol}>+ Nova solicitação</button>
          </div>

          {solFiltradas.length===0 && (
            <div className="empty-state">
              <div className="icon">📋</div>
              <div>Nenhuma solicitação encontrada.</div>
            </div>
          )}

          <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
            {solFiltradas.map(s => {
              const crit = isCritico(s);
              const cc = catColor(cats, s.categoria);
              const sc = statusColor[s.status] || statusColor["Em andamento"];
              return (
                <div key={s.mondayId} className={`sol-card card-enter ${crit?"critico":""} ${s.status==="Concluído"?"concluido":""}`}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:"12px",flexWrap:"wrap"}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"7px",flexWrap:"wrap"}}>
                        <span style={{fontWeight:600,fontSize:"14px",color:"var(--text)"}}>{s.titulo}</span>
                      </div>
                      <div style={{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}}>
                        <span className="badge" style={{background:cc.bg,color:cc.color}}>{s.categoria}</span>
                        <select className="status-select" value={s.status} onChange={e=>changeStatusSol(s,e.target.value)} style={{background:sc.bg,color:sc.color}}>
                          {STATUS_SOL.map(st=><option key={st}>{st}</option>)}
                        </select>
                      </div>
                      {s.obs && <div style={{fontSize:"12px",color:"var(--text3)",marginTop:"7px",lineHeight:1.5}}>{s.obs}</div>}
                    </div>
                    <div style={{display:"flex",gap:"14px",alignItems:"center",flexShrink:0}}>
                      <PrazoTag label="Interno" dateStr={s.prazoInterno} />
                      <PrazoTag label="Externo" dateStr={s.prazoExterno} />
                      <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
                        <button className="btn btn-ghost" style={{padding:"5px 12px",fontSize:"12px"}} onClick={()=>openEditSol(s)}>Editar</button>
                        <button className="btn btn-danger" style={{padding:"5px 12px",fontSize:"12px"}} onClick={()=>setConfirmDel({type:"sol",item:s,titulo:s.titulo})}>Excluir</button>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── ABA SEMANAIS ── */}
      {!loading && aba==="semanais" && (
        <div className="card-enter">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px",flexWrap:"wrap",gap:"8px"}}>
            <span style={{fontSize:"12.5px",color:"var(--text3)"}}>Clique na atividade para abrir detalhes e adicionar comentários</span>
            <div style={{display:"flex",gap:"8px"}}>
              <button className="btn btn-ghost" onClick={resetSemana}>↺ Reiniciar semana</button>
              <button className="btn btn-primary" onClick={openNewSeman}>+ Nova atividade</button>
            </div>
          </div>

          {vencidas.length > 0 && (
            <div className="alerta alerta-critico" style={{marginBottom:"16px"}}>
              <span>⏰</span>
              <strong>{vencidas.length} {vencidas.length===1?"atividade vencida":"atividades vencidas"}</strong>
              <span>– reagende ou marque como concluída</span>
            </div>
          )}

          {semanais.length===0 && (
            <div className="empty-state">
              <div className="icon">📅</div>
              <div>Nenhuma atividade cadastrada.</div>
            </div>
          )}

          {DIAS.map(dia => {
            const tarefas = semanais.filter(t => t.dia===dia);
            if (!tarefas.length) return null;
            return (
              <div key={dia} style={{marginBottom:"22px"}}>
                <div className="dia-header">{dia}</div>
                <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                  {tarefas.map(t => {
                    const venc = isVencida(t);
                    return (
                      <div key={t.mondayId} className={`seman-card ${venc&&!t.feito?"vencida":""}`} onClick={()=>setModalAtiv(t)}>
                        <Checkbox checked={t.feito} onClick={()=>toggleSeman(t)} />
                        <div style={{flex:1,minWidth:0}}>
                          <span style={{fontSize:"13.5px",textDecoration:t.feito?"line-through":"none",color:t.feito?"var(--text3)":"var(--text)",userSelect:"none"}}>{t.titulo}</span>
                          {t.comentarios?.length > 0 && (
                            <span style={{fontSize:"11px",color:"var(--text3)",marginLeft:"8px"}}>💬 {t.comentarios.length}</span>
                          )}
                          {t.prazoData && (
                            <span style={{fontSize:"11px",color:"var(--text3)",marginLeft:"8px",fontFamily:"'DM Mono',monospace"}}>📅 {fmt(t.prazoData)}</span>
                          )}
                        </div>
                        {venc && !t.feito && <span className="badge" style={{background:"var(--red-light)",color:"var(--red)",fontSize:"10px"}}>Vencida</span>}
                        <button onClick={e=>{e.stopPropagation();openEditSeman(t);}} style={{background:"none",border:"none",color:"var(--text3)",fontSize:"12px",cursor:"pointer",padding:"2px 8px"}}>Editar</button>
                        <button onClick={e=>{e.stopPropagation();setConfirmDel({type:"seman",id:t.mondayId,titulo:t.titulo});}} style={{background:"none",border:"none",color:"var(--red)",fontSize:"14px",cursor:"pointer",padding:"2px 8px"}}>✕</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── MODAIS ── */}
      {modalAtiv && (
        <ModalAtividade
          atividade={modalAtiv}
          onClose={()=>setModalAtiv(null)}
          onSave={saveAtividade}
          saving={saving}
        />
      )}

      {modalCats && (
        <ModalCategorias
          cats={cats}
          onClose={()=>setModalCats(false)}
          onSave={handleSaveCats}
          saving={saving}
        />
      )}

      {modalSol && (
        <Modal title={editSol?"Editar solicitação":"Nova solicitação"} onClose={()=>setModalSol(false)}>
          <Field label="Título *">
            <input className="inp" value={formSol.titulo} onChange={e=>setFormSol({...formSol,titulo:e.target.value})} placeholder="Descreva a solicitação" />
          </Field>
          <div style={{display:"flex",gap:"12px"}}>
            <Field label="Categoria">
              <select className="inp" value={formSol.categoria} onChange={e=>setFormSol({...formSol,categoria:e.target.value})}>
                {cats.map(c=><option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Status">
              <select className="inp" value={formSol.status} onChange={e=>setFormSol({...formSol,status:e.target.value})}>
                {STATUS_SOL.map(s=><option key={s}>{s}</option>)}
              </select>
            </Field>
          </div>
          <div style={{display:"flex",gap:"12px"}}>
            <Field label="Prazo interno *">
              <input type="date" className="inp" value={formSol.prazoInterno} onChange={e=>setFormSol({...formSol,prazoInterno:e.target.value})} />
            </Field>
            <Field label="Prazo externo *">
              <input type="date" className="inp" value={formSol.prazoExterno} onChange={e=>setFormSol({...formSol,prazoExterno:e.target.value})} />
            </Field>
          </div>
          <Field label="Observações">
            <textarea className="inp" style={{resize:"vertical",minHeight:"72px"}} value={formSol.obs} onChange={e=>setFormSol({...formSol,obs:e.target.value})} placeholder="Informações adicionais (opcional)" />
          </Field>
          {formErr && <div style={{background:"var(--red-light)",color:"var(--red)",fontSize:"12.5px",padding:"8px 12px",borderRadius:"8px",marginBottom:"12px"}}>{formErr}</div>}
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"4px"}}>
            <button className="btn btn-ghost" onClick={()=>setModalSol(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={submitSol} disabled={saving}>{saving?"Salvando…":"Salvar"}</button>
          </div>
        </Modal>
      )}

      {modalSeman && (
        <Modal title={editSeman?"Editar atividade":"Nova atividade semanal"} onClose={()=>setModalSeman(false)}>
          <Field label="Título *">
            <input className="inp" value={formSeman.titulo} onChange={e=>setFormSeman({...formSeman,titulo:e.target.value})} placeholder="Nome da atividade" />
          </Field>
          <Field label="Dia da semana">
            <select className="inp" value={formSeman.dia} onChange={e=>setFormSeman({...formSeman,dia:e.target.value})}>
              {DIAS.map(d=><option key={d}>{d}</option>)}
            </select>
          </Field>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end",marginTop:"4px"}}>
            <button className="btn btn-ghost" onClick={()=>setModalSeman(false)}>Cancelar</button>
            <button className="btn btn-primary" onClick={submitSeman} disabled={saving}>{saving?"Salvando…":"Salvar"}</button>
          </div>
        </Modal>
      )}

      {confirmDel && (
        <Modal title="Confirmar exclusão" onClose={()=>setConfirmDel(null)}>
          <p style={{fontSize:"13.5px",color:"var(--text2)",marginBottom:"20px",lineHeight:1.6}}>
            Tem certeza que deseja excluir <strong>"{confirmDel.titulo}"</strong>? Essa ação não pode ser desfeita.
          </p>
          <div style={{display:"flex",gap:"8px",justifyContent:"flex-end"}}>
            <button className="btn btn-ghost" onClick={()=>setConfirmDel(null)}>Cancelar</button>
            <button className="btn" style={{background:"var(--red)",color:"#fff"}} onClick={()=>confirmDel.type==="sol"?deleteSol(confirmDel.item):deleteSeman(confirmDel.id)}>Excluir</button>
          </div>
        </Modal>
      )}

    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
